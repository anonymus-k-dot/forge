services:
  forge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forge_app
    ports:
      - "5000:5000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=5000
      - FLASK_DEBUG=false
      # Points at the bundled local database. Migrations are never run automatically:
      #   docker compose run --rm forge alembic upgrade head
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge-local-dev-only}@db:5432/${POSTGRES_DB:-forge}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    # Local development database only. For hosted PostgreSQL (Neon, Supabase, ...) set
    # DATABASE_URL instead and do not run this service.
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      # Local-only default; override POSTGRES_PASSWORD in .env. Never use it elsewhere.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge-local-dev-only}
    ports:
      # Published on localhost only. 5433 avoids clashing with a natively installed
      # PostgreSQL on 5432; override with POSTGRES_PORT.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - forge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  forge_pgdata:
