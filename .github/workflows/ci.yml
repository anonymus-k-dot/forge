name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend:
    # The React frontend (web/): locked install, type-check, unit tests, production build,
    # then Flask serving that build. Same Node version as the Dockerfile's build stage.
    name: Frontend (type-check, unit tests, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run typecheck

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Flask serving of the build
        # FORGE_REQUIRE_WEB_BUILD=1: the build and Node checks fail here instead of skipping.
        env:
          FORGE_REQUIRE_WEB_BUILD: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest -v --tb=short tests/test_web_frontend.py

  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # Throwaway PostgreSQL for migration and database tests (CI-only credentials).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-ci-only
          POSTGRES_DB: forge
        ports:
          # 5433 on the runner: the test guard refuses port 5432 (tests/db/safety.py).
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Migrations (fresh database, repeat run, model check)
        env:
          DATABASE_URL: postgresql://forge:forge-ci-only@localhost:5433/forge
        run: |
          alembic upgrade head
          alembic current
          alembic upgrade head
          alembic check

      - name: Run Test Suite
        env:
          GEMINI_API_KEY: mock_key_for_testing
          TEST_DATABASE_URL: postgresql://forge:forge-ci-only@localhost:5433/postgres
          FORGE_REQUIRE_DB_TESTS: "1"
        run: |
          pytest -v --tb=short
