# Alembic CLI configuration. The database URL is NOT stored here: env.py reads DATABASE_URL
# from the environment (or .env). Usage from the repository root:
#   alembic upgrade head        alembic current        alembic check        alembic history
[alembic]
script_location = %(here)s/src/forge/db/migrations
prepend_sys_path = src
path_separator = os
